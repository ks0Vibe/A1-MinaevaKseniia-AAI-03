services:
  api:
    build:
      context: ..
      dockerfile: deployment/api/Dockerfile

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deployment/app/Dockerfile

    ports:
      - "8501:8501"

    environment:
      API_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy